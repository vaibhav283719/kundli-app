name: kundli_app
description: A complete Kundli/Janm Kundali astrology app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.6
  firebase_crashlytics: ^3.4.18
  go_router: ^13.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  fl_chart: ^0.67.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^9.0.0
  image_picker: ^1.0.7
  table_calendar: ^3.1.1
  url_launcher: ^6.2.6
  dio: ^5.4.3+1
  get_it: ^7.7.0
  equatable: ^2.0.5
  flutter_local_notifications: ^17.2.1+2
  in_app_purchase: ^3.1.13
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
